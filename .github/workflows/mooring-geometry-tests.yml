name: Mooring geometry tests

on:
  push:
    branches:
      - main
      - feature/interactive-mooring-plan
  pull_request:

jobs:
  geometry-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install geometry dependencies
        run: python -m pip install --upgrade pip && python -m pip install numpy pandas
      - name: Run geometry tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
